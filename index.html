<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TODO Planning</title>
  <link rel="stylesheet" href="./CSS/styles.css?v=250" />
</head>
<body>
  <section id="authView" class="auth-shell">
    <div class="auth-card">
      <div class="auth-card__brand">
        <span class="topbar__eyebrow">TODO</span>
        <strong class="topbar__title">Planning</strong>
      </div>

      <form id="authForm" class="auth-form">
        <label class="detail-field">
          <span class="detail-field__label">E-post</span>
          <input id="authEmail" class="detail-field__control" type="email" autocomplete="email" required />
        </label>

        <label class="detail-field">
          <span class="detail-field__label">Lösenord</span>
          <input id="authPassword" class="detail-field__control" type="password" autocomplete="current-password" required />
        </label>

        <button id="authSubmit" class="primary-button auth-submit" type="submit">Logga in</button>
        <p id="authError" class="auth-error" aria-live="polite"></p>
      </form>
    </div>
  </section>

  <div id="appView" hidden style="display:none;">
    <header class="topbar">
      <div class="topbar__inner">
        <div class="topbar__brand" aria-label="Appnamn">
          <span class="topbar__eyebrow">TODO</span>
          <strong class="topbar__title">Planning</strong>
        </div>
        <nav id="tableNav" class="table-nav topbar__nav" aria-label="Vyflikar"></nav>
        <div class="topbar__user">
        <button id="userBadge" class="topbar__user-badge topbar__settings" type="button" aria-label="Profil och inställningar">--</button>
      </div>
      </div>
    </header>

    <main class="page">
      <section id="app" class="view-shell"></section>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="./JS/spec.js?v=251"></script>
  <script type="module">
    import { bootstrapAuth } from './JS/auth.js?v=251';
    await bootstrapAuth();
  </script>
</body>
</html>
